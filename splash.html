<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindSpark</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #87a7c0, #80b3bc);
        font-family: "Poppins", sans-serif;
        overflow: hidden;
    }

    /* Glow circle container */
    .glow-wrap {
        position: relative;
        padding: 40px;
        border-radius: 50%;
        animation: glowPulse 3s infinite alternate;
    }

    /* Outer circular glow */
    @keyframes glowPulse {
        0% { box-shadow: 0 0 20px rgba(246, 243, 243, 0.3), 0 0 40px rgba(236, 237, 238, 0.5); }
        100% { box-shadow: 0 0 35px rgba(239, 237, 237, 0.5), 0 0 70px rgba(244, 244, 241, 0.9); }
    }

    /* Glass-like circular frame around logo */
    .circle-frame {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: rgba(227, 219, 219, 0.18);
        border: 3px solid rgba(233, 227, 227, 0.3);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        box-shadow: inset 0 5px 20px rgba(0,0,0,0.15);
        animation: popIn 1.2s ease-out forwards;
        opacity: 0;
        transform: scale(0.6);
    }

    .circle-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;

    }

    @keyframes popIn {
        0% { opacity: 0; transform: scale(0.6); }
        60% { opacity: 1; transform: scale(1.1); }
        100% { opacity: 1; transform: scale(1); }
    }

    /* App name */
    .app-name {
        font-size: 34px;
        font-weight: 800;
        color: white;
        text-align: center;
        margin-top: 20px;
        letter-spacing: 1px;
        text-shadow: 0px 3px 8px rgba(0,0,0,0.3);
        animation: textFade 2s ease-in-out;
    }

    /* Tagline */
    .tagline {
        font-size: 16px;
        color: rgba(255,255,255,0.95);
        text-align: center;
        margin-top: 5px;
        font-weight: 500;
        letter-spacing: 0.5px;
        animation: textFade 2.4s ease-in-out;
    }

    @keyframes textFade {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Fade out effect before redirect */
    .fade-out {
        animation: fadeOut 0.7s forwards;
    }
    @keyframes fadeOut {
        to { opacity: 0; }
    }
</style>

<script>
    // Wait then fade out + redirect
    setTimeout(() => {
        document.body.classList.add("fade-out");
        setTimeout(() => {
            window.location.href = "index.html";
        }, 600);
    }, 2500);
</script>

</head>

<body>
    <div>
        <div class="glow-wrap">
            <div class="circle-frame">
                <img src="https://t3.ftcdn.net/jpg/15/74/54/38/240_F_1574543881_EzvXk9Ir950RqReeOXdflAZ5o8jZe2UW.jpg" alt="Logo">
            </div>
        </div>

        <div class="app-name">MindSpark</div>
        <div class="tagline">Ignite Your Knowledge</div>
    </div>
</body>
</html>
