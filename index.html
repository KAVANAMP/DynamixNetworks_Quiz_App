<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MindSpark</title>

  <!-- Link CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* Additional Landing Screen Styles */
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #d7d2b1, #a89cc6);
      color: #fff;
      margin: 0;
    }

    .landing {
      text-align: center;
      padding: 80px 20px;
      animation: fadeIn 1.2s ease-out;
    }

    /* Shining Circular Frame */
    .logo-frame {
      width: 160px;
      height: 160px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 6px;
      background: radial-gradient(circle, #e3b3b3 0%, #d6c9ff 40%, #d8e951 90%);
      box-shadow: 0 0 25px rgba(157, 228, 171, 0.7), 0 0 55px rgba(214, 223, 140, 0.8);
      animation: glowPulse 2s infinite alternate;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* App Title Styling */
    .main-title {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ded9db, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
    margin-top: 10px;      /* space above */
    margin-bottom: 10px;   /* space below (increase this if you want more) */
}

    

    /* Glass Card effect for Main Content */
    .screen {
      background: #89d9d933;
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(0,0,0,0.2);
      animation: slideUp .9s ease-out;
      color: #000;
    }

    .primary, .secondary {
      font-family: inherit;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 15px rgba(106, 175, 194, 0.4), 0 0 35px rgba(94, 179, 218, 0.6); }
      100% { box-shadow: 0 0 30px rgba(101, 185, 212, 0.7), 0 0 60px rgb(192, 138, 242); }
    }

    footer small {
      color: #eee;
    }
  </style>

</head>
<body>

  <!-- ✨ Beautiful Landing Header -->
  <div class="landing">

    <div class="logo-frame">
      <img src="https://t3.ftcdn.net/jpg/15/74/54/38/240_F_1574543881_EzvXk9Ir950RqReeOXdflAZ5o8jZe2UW.jpg" alt="MindSpark Logo" />
    </div>

    <div class="main-title">MindSpark</div>
    <div class="tagline">Ignite Your Knowledge</div>

  </div>

  <div class="container">

    <!-- Start Screen -->
    <section id="start-screen" class="screen">

      <h2 style="text-align:center; margin: bottom 10px;">Start Your Journey </h2>

      <div class="category-container">
    <label for="category-select">Select Category</label>
    <select id="category-select">
        <option value="webdev">Web Development</option>
        <option value="math">Math</option>
        <option value="gk">General Knowledge</option>
    </select>
</div>


      <div class="controls" style="text-align:center;">
        <button id="start-btn" class="primary">Start Quiz</button>
      </div>

    </section>

    <!-- Quiz screen (unchanged since script.js handles it) -->
    <section id="quiz-screen" class="screen hidden">
      <div class="top-row">
        <div id="level-indicator">Level 1 • Easy</div>
        <div id="score-indicator">Score: <span id="score-value">0</span></div>
      </div>

      <div id="progress-container" aria-hidden="true">
        <div id="progress-bar"></div>
      </div>

      <div id="question-block">
        <h3 id="question-text"></h3>
        <div id="options-container"></div>
      </div>

      <div class="nav-row">
        <button id="skip-btn" class="secondary">Skip</button>
        <button id="next-btn" class="primary hidden">Next</button>
      </div>
    </section>

    <!-- Level complete -->
    <section id="level-complete-screen" class="screen hidden">
      <div id="gold-animation" class="gold-animation"></div>
      <h2 id="level-complete-title">Level Complete!</h2>
      <p id="level-reward-text" class="reward-text"></p>
      <div class="trophy-container hidden">
    <img id="trophy-img" src="" alt="Trophy" />
</div>


      <div class="controls">
        <button id="continue-btn" class="primary">Continue to Next Level</button>
        <button id="finish-btn" class="secondary hidden">Finish Quiz</button>
      </div>
    </section>

    <!-- Final result -->
    <section id="result-screen" class="screen hidden">
      <h2>Final Score</h2>
      <p id="final-score-text"></p>
      <p id="final-rewards"></p>
      <div class="controls">
        <button id="restart-btn" class="primary">Restart</button>
      </div>
    </section>

    <footer class="footer">
      <small>“Quiz makes learning fun.”</small>
    </footer>

  </div>

  <!-- JS Files -->
  <script src="questions.js"></script>
  <script src="script.js"></script>

</body>
</html>
